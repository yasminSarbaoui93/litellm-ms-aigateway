name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Bicep CLI
        run: |
          if ! command -v bicep >/dev/null 2>&1; then
            az bicep install
            echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
          fi
          bicep --version
      - name: Test scripts and compile infrastructure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
